name: Revision 2 annual AC reproducibility checks

on:
  pull_request:
    paths:
      - "scripts/29_aggregate_revision2_annual_AC.py"
      - "tests/test_29_revision2_aggregate.py"
      - "results/revision2/**"
      - "results/annual_audit/28_annual_AC_primary_fixed_CET.csv"
      - "results/annual_audit/28_annual_AC_sensitivity_civil_unshifted.csv"
      - ".github/workflows/revision2-ac-checks.yml"
  workflow_dispatch:

jobs:
  step29:
    name: Regenerate and compare Step 29 AC outputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run script independently on committed data
        run: python scripts/29_aggregate_revision2_annual_AC.py --check-only
      - name: Run Step 29 unit and integration checks
        run: python -m unittest discover -s tests -p "test_29*.py" -v
