name: Revision 2 Figure 3 reproducibility

on:
  pull_request:
    paths:
      - "scripts/35_rebuild_revision2_sky_bins.py"
      - "tests/test_35_revision2_sky_bins.py"
      - "results/revision2/35_*"
      - "derived_data/annual_unshaded_analysis.csv"
      - "config.json"
      - "results/annual_audit/28_annual_AC_primary_fixed_CET.csv"
      - "results/annual_audit/28_annual_AC_sensitivity_civil_unshifted.csv"
      - ".github/workflows/revision2-sky-bin-checks.yml"
  workflow_dispatch:

jobs:
  figure3:
    name: Check paired cohort, nMBE and all 180 sky-bin cases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical/plot dependencies
        run: python -m pip install numpy pandas matplotlib
      - name: Recompute and compare all committed CSVs without writing
        run: python scripts/35_rebuild_revision2_sky_bins.py --check-only
      - name: Run independent unit and data-integration checks
        run: python -m unittest discover -s tests -p "test_35*.py" -v
      - name: Generate figures and source-fingerprint manifest from checked-out files
        run: python scripts/35_rebuild_revision2_sky_bins.py --output-dir "${{ runner.temp }}/figure3"
      - name: Save publication-format figure previews and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: revision2-figure3-candidate-and-clock-sensitivity
          path: ${{ runner.temp }}/figure3/
          retention-days: 30
